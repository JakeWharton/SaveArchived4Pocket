[versions]
androidx-compose = "1.8.0"
kotlin = "2.1.20"
kotlinx-serialization = "1.8.1"
sqldelight = "2.0.2"
okhttp = "4.12.0"
retrofit = "2.11.0"

[libraries]
accompanist-systemUiController = "com.google.accompanist:accompanist-systemuicontroller:0.36.0"

androidGradlePlugin = "com.android.tools.build:gradle:8.10.0"

androidx-activity-compose = "androidx.activity:activity-compose:1.10.1"
androidx-compose-material3 = "androidx.compose.material3:material3:1.3.2"
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "androidx-compose" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "androidx-compose" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "androidx-compose" }
androidx-work-runtime = "androidx.work:work-runtime-ktx:2.10.1"

kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-composePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-serializationPlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }

kotlinx-datetime = "org.jetbrains.kotlinx:kotlinx-datetime:0.6.2"
kotlinx-immutableCollection = "org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.8"

kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

retrofit-core = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinxSerialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }

okhttp-core = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

spotlessPlugin = "com.diffplug.spotless:spotless-plugin-gradle:7.0.3"

sqldelight-plugin = { module = "app.cash.sqldelight:gradle-plugin", version.ref = "sqldelight" }
sqldelight-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }

paparazziPlugin = "app.cash.paparazzi:paparazzi-gradle-plugin:1.3.5"

ktlint = "com.pinterest.ktlint:ktlint-cli:1.5.0"
composeRules = "io.nlopez.compose.rules:ktlint:0.4.22"

junit = "junit:junit:4.13.2"
testParameterInjector = "com.google.testparameterinjector:test-parameter-injector:1.18"
